name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Format check (rustfmt)
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Lint (clippy)
        run: cargo clippy -- -D clippy::correctness -W clippy::style -W clippy::perf
        working-directory: src-tauri

      - name: Test backend
        run: cargo test --no-default-features
        working-directory: src-tauri
