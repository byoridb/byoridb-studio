[package]
name = "byoridb-studio"
version = "0.1.0"
description = "ByoriDB Studio - Desktop management tool for ByoriDB"
authors = ["ByoriDB Team"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.12", optional = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
# OS-native secret store for connection passwords (macOS Keychain via the
# Security framework). Keeps credentials off disk and out of git.
keyring = { version = "3", features = ["apple-native"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
grpc = ["tonic"]

[lints.clippy]
correctness = "deny"
style = "warn"
perf = "warn"
