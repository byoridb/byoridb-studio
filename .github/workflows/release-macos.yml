name: Release (macOS)

# 두 가지 모드로 동작한다.
#   tag    — v* 태그를 밀면 그 버전으로 서명·공증된 DMG 를 릴리스한다.
#            태그는 package.json 의 버전과 같아야 한다(v0.2.0 ↔ 0.2.0).
#   dryrun — workflow_dispatch. 릴리스를 만들지 않고 빌드·서명·공증 경로만
#            검증한다. 어느 ref 에서 실행해도(태그 포함) 릴리스는 만들지 않는다.
#
# 버전은 package.json 한 곳에서 정하고 이 워크플로는 올리지 않는다
# (scripts/check-version.mjs 가 Cargo.toml·Cargo.lock·studio-tools.json 을 대조한다).
# 이 저장소가 DB 관리 도구에서 영상 편집기로 바뀐 뒤로 이 워크플로는 아직
# 한 번도 돌려 보지 않았다. dryrun 으로 먼저 확인한 뒤 태그로 릴리스한다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 같은 ref 의 릴리스 두 개가 동시에 돌지 않게 한다.
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 초 단위로 끝나는 검사만 모아둔다. 서명 시크릿이 없거나 버전이 어긋난
  # 푸시가 macOS 러너를 10분 태우고 나서 죽는 일을 막는다.
  preflight:
    name: Preflight (secrets + version)
    runs-on: ubuntu-latest
    steps:
      # checkout 이나 툴체인보다 먼저. 시크릿만 읽으므로 가장 싸다.
      # 값의 유효성은 인증서를 실제로 import 할 때 검증된다.
      - name: Check macOS signing credentials are present
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD SIGN_IDENTITY \
                      APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing macOS signing secrets: ${missing[*]}."
            echo "::error::byoridb org secrets, shared with byoridb/byori and byoridb/byoridb."
            echo "::error::Shipping an unsigned DMG that the README calls a release is worse"
            echo "::error::than shipping nothing; failing here."
            exit 1
          fi
          echo "all six signing secrets are present"

      - uses: actions/checkout@v7

      # 버전은 package.json 이 정하고 scripts/check-version.mjs 가 나머지를 대조한다.
      - name: Check version consistency
        run: |
          set -euo pipefail
          node scripts/check-version.mjs
          PKG=$(node -p "require('./package.json').version")
          # 태그 모드에서는 태그가 선언된 버전과 같아야 한다.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PKG" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match project version $PKG"
              exit 1
            fi
            echo "tag $GITHUB_REF_NAME matches version $PKG"
          fi

  build:
    name: Build signed universal DMG
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 120
    # Release 를 만들고 DMG 를 올리기 위해 필요하다.
    # 리포의 기본 워크플로 권한은 read 이므로 여기서 명시적으로 올린다.
    permissions:
      contents: write
    env:
      # 서명·공증 시크릿은 여기(job 수준)에 두지 않는다. npm ci, verify, brew,
      # 서드파티 액션까지 잡의 모든 스텝이 받게 되기 때문이다. 필요한 세 스텝
      # (인증서 import, 앱 빌드, DMG 공증)에만 스텝 env 로 준다.
      #
      # runner 컨텍스트는 job 레벨 env 에서 쓸 수 없다. 키체인 경로는 각 스텝에서
      # $RUNNER_TEMP 로 만들고, 비밀번호는 github 컨텍스트만으로 구성한다.
      KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
      KEYCHAIN_NAME: byori-studio-signing.keychain-db
      # brew: 요청한 것만 설치한다.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # ci.yml 과 같은 버전으로 고정한다. "최신 stable" 이면 러너의 Rust 가 올라간 날
          # 새 린트 때문에 릴리스만 실패한다(v0.2.0 첫 실행이 그랬다). 올릴 때는 두 파일을
          # 함께, PR 로 올려 CI 에서 먼저 확인한다.
          toolchain: 1.100.0
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 버전은 package.json 그대로다(tauri.conf.json 의 version 이 "../package.json").
      # 태그와 같은지는 preflight 가 이미 확인했다.
      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            MODE=tag
          else
            MODE=dryrun
          fi
          {
            echo "mode=$MODE"
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "mode=$MODE version=$VERSION tag=v$VERSION"

      - name: Install frontend deps
        run: npm ci

      # 인증서를 import 하기 전에 ci.yml 과 같은 검사를 모두 통과시킨다.
      # 검증되지 않은 커밋에서 릴리스가 나가는 것을 막는 게 목적이므로
      # 스텝 순서 자체가 게이트다.
      #
      # 렌더러와 통합 테스트가 실제 ffmpeg/ffprobe 를 실행한다. python3 는
      # macOS 러너에 들어 있다.
      - name: Install FFmpeg
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          python3 --version

      - name: Format check (rustfmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # 버전 대조, 프런트 테스트, Rust 테스트, 실제 서비스 통합 테스트, 프로덕션 빌드.
      # 테스트는 빈 포트와 자기 데이터 폴더로 서비스를 띄운다. 이 변수는 그 밖의
      # 무엇도 러너의 홈을 쓰지 않게 한다.
      - name: Verify
        run: npm run verify
        env:
          BYORI_STUDIO_HOME: ${{ runner.temp }}/byori-studio-home

      - name: Lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # byoridb/byoridb 의 release.yml 에서 검증된 절차를 그대로 쓴다.
      # 두 가지가 핵심이고 둘 다 조용히 실패한다:
      #  1) p12 에 intermediate 가 없어 Apple 의 Developer ID CA 를 따로 넣어야 한다.
      #  2) `security list-keychains -s` 는 검색 목록을 확장하지 않고 '대체'한다.
      #     기존 목록을 다시 붙이지 않으면 trust anchor 를 담은 키체인이 빠진다.
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/$KEYCHAIN_NAME"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          for authority in DeveloperIDG2CA DeveloperIDCA; do
            authority_path="$RUNNER_TEMP/$authority.cer"
            curl -fsSL "https://www.apple.com/certificateauthority/$authority.cer" \
              -o "$authority_path"
            security import "$authority_path" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          done

          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')

          rm -f "$CERTIFICATE_PATH"

          # 키체인을 직접 지정했을 때 identity 가 하나만 보이는지 확인한다.
          # codesign 안에서 몇 분 뒤에 죽는 대신 읽을 수 있는 이유로 여기서 죽는다.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | tee "$RUNNER_TEMP/identities"
          grep -q "1 valid identities found" "$RUNNER_TEMP/identities" \
            || { echo "::error::expected exactly one codesigning identity"; exit 1; }
          grep -qF "$APPLE_SIGNING_IDENTITY" "$RUNNER_TEMP/identities" \
            || { echo "::error::MACOS_SIGN_IDENTITY does not name the imported identity"; exit 1; }

          # Tauri 는 codesign 에 --keychain 을 넘기지 않고 기본 검색 목록에
          # 의존한다. 그래서 키체인을 명시하지 않은 조회로도 보이는지가 실제로
          # 필요한 조건이고, 이걸 따로 검증한다.
          security find-identity -v -p codesigning \
            | grep -qF "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::identity is not visible in the default keychain search list"; exit 1; }

      # 번들에는 실행 파일이 둘 들어간다: 앱(byori-studio)과 같은 크레이트의
      # src/bin/studio-service. externalBin 이 아니라 크레이트의 bin 대상이라
      # Tauri 가 target/<대상>/release/ 에서 둘 다 복사한다. universal 빌드에서
      # Tauri CLI 는 주 실행 파일만 lipo 로 합쳐 target/universal-apple-darwin/release/
      # 에 두므로, studio-service 는 여기서 두 아키텍처로 빌드해 같은 자리에 합쳐 둔다.
      # 없으면 번들 단계가 파일을 찾지 못한다. 서명은 번들 단계에서 Tauri 가 한다.
      # (CLI 가 나중에 직접 합치게 되더라도 같은 파일을 덮어쓸 뿐이다.)
      - name: Build universal studio-service
        run: |
          set -euo pipefail
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path src-tauri/Cargo.toml \
              --target "$triple" --bin studio-service
          done
          OUT=src-tauri/target/universal-apple-darwin/release
          mkdir -p "$OUT"
          lipo -create -output "$OUT/studio-service" \
            src-tauri/target/aarch64-apple-darwin/release/studio-service \
            src-tauri/target/x86_64-apple-darwin/release/studio-service
          lipo -info "$OUT/studio-service"

      # universal 로 빌드해 Intel 과 Apple Silicon 을 DMG 하나로 덮는다.
      # 이 스텝의 env 가 채워져 있으므로 Tauri 가 .app 을 서명하고 공증까지 진행한다.
      # Tauri 는 아래 이름들을 읽는다. org 시크릿 이름과 달라 여기서 매핑한다.
      #   MACOS_SIGN_IDENTITY  -> APPLE_SIGNING_IDENTITY
      #   APPLE_APP_PASSWORD   -> APPLE_PASSWORD
      #
      # APPLE_CERTIFICATE 는 의도적으로 넘기지 않는다. 그 경로를 쓰면 Tauri 가
      # 자체 키체인에 p12 만 import 하는데, Keychain Access 로 뽑은 p12 에는
      # leaf 와 개인키만 들어 있어 Developer ID intermediate 가 빠지고 codesign 이
      # identity 를 찾지 못한다. 위 import 스텝이 intermediate 까지 넣은 키체인을
      # 검색 목록에 올려두므로 identity 이름만 주면 된다.
      #
      # 재시도를 붙인 이유: Tauri 가 부르는 bundle_dmg.sh 는 DMG 창을 꾸미려고
      # AppleEvent 로 Finder 를 조작하는데, Finder 가 바쁘거나 없으면
      # `execution error ... (-1712)` 로 죽는다. 로컬에서 실제로 재현했고,
      # 그 단계를 건너뛰는 --skip-jenkins 를 Tauri 는 넘기지 않으며 그걸 켤
      # 설정도 없다. 릴리스에서 가장 깨지기 쉬운 지점이라 한 번 다시 시도한다.
      - name: Build signed and notarized app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          attempt_build() {
            npm run tauri build -- --target universal-apple-darwin
          }

          if attempt_build; then
            exit 0
          fi

          echo "::warning::tauri build failed; retrying once (bundle_dmg.sh driving Finder is the usual cause)"

          # 실패한 시도가 남긴 read/write 셰도우 이미지와 마운트를 치운다.
          # 그대로 두면 재시도가 같은 자리에서 다시 죽는다.
          rm -f src-tauri/target/universal-apple-darwin/release/bundle/macos/rw.*.dmg
          for vol in /Volumes/dmg.*; do
            [ -d "$vol" ] && hdiutil detach "$vol" -force || true
          done
          sleep 15

          attempt_build

      - name: Locate artifacts
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle"
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' | head -1)
          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$APP" ] || { echo "::error::no .app was produced"; exit 1; }
          [ -n "$DMG" ] || { echo "::error::no .dmg was produced"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "app: $APP"
          echo "dmg: $DMG"

      # 서명은 우리가 보장하는 것이므로 하드 실패로 검사한다.
      # 자격증명이 없으면 Tauri 는 adhoc 서명으로 조용히 넘어가는데,
      # Developer ID authority 검사가 바로 그 경우를 잡아낸다.
      - name: Verify app signature
        run: |
          set -euo pipefail
          APP="${{ steps.artifacts.outputs.app }}"

          codesign --verify --deep --strict --verbose=2 "$APP"

          codesign --display --verbose=2 "$APP" 2>&1 \
            | grep -q '^Authority=Developer ID Application' \
            || { echo "::error::app is not signed by a Developer ID authority"; exit 1; }

          # 하드닝 런타임이 없으면 공증이 거부된다. 실패 지점을 읽을 수 있게
          # 공증보다 앞서 따로 확인한다.
          codesign --display --verbose=2 "$APP" 2>&1 | grep -q 'flags=.*runtime' \
            || { echo "::error::hardened runtime is not enabled on the app"; exit 1; }

          # 빌드된 앱이 정말 universal 인지 확인한다. 한쪽 아키텍처만 담긴 DMG 는
          # 절반의 사용자에게 열리지 않는다.
          # 실행 파일은 둘이다(앱과 studio-service). 둘 다 확인한다.
          for name in byori-studio studio-service; do
            BIN="$APP/Contents/MacOS/$name"
            [ -f "$BIN" ] || { echo "::error::$name is missing from the bundle"; exit 1; }
            lipo -info "$BIN"
            lipo -info "$BIN" | grep -q 'x86_64' \
              || { echo "::error::$name has no x86_64 slice"; exit 1; }
            lipo -info "$BIN" | grep -q 'arm64' \
              || { echo "::error::$name has no arm64 slice"; exit 1; }
            # 두 실행 파일 각각의 서명도 본다. 공증이 몇 분 뒤 거부하기 전에
            # 어느 파일이 문제인지 여기서 드러난다.
            codesign --display --verbose=2 "$BIN" 2>&1 \
              | grep -q '^Authority=Developer ID Application' \
              || { echo "::error::$name is not signed by a Developer ID authority"; exit 1; }
            codesign --display --verbose=2 "$BIN" 2>&1 | grep -q 'flags=.*runtime' \
              || { echo "::error::hardened runtime is not enabled on $name"; exit 1; }
          done

          # 예제 소재는 리소스로 들어간다(tauri.conf.json 의 bundle.resources).
          [ -d "$APP/Contents/Resources/demo" ] \
            || { echo "::error::the demo resources are missing from the bundle"; exit 1; }

          # 번들 버전이 릴리스 버전과 같은지 확인한다.
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP/Contents/Info.plist")
          [ "$BUNDLE_VERSION" = "${{ steps.version.outputs.version }}" ] \
            || { echo "::error::bundle version $BUNDLE_VERSION is not ${{ steps.version.outputs.version }}"; exit 1; }

          # Tauri 는 공증 후 ticket 을 staple 하는 것이 기본이지만(skipStapling
          # 을 켜면 건너뛴다), 사용자가 내려받는 것은 DMG 이고 staple 이 없어도
          # Gatekeeper 가 온라인으로 ticket 을 조회한다. 그래서 릴리스를 막지
          # 않고 경고만 남긴다. DMG 의 staple 은 아래에서 하드 실패로 강제한다.
          if xcrun stapler validate "$APP" >/dev/null 2>&1; then
            echo "the .app carries a stapled notarization ticket"
          else
            echo "::warning::the .app inside the DMG is not stapled; Gatekeeper will resolve its ticket online on first launch"
          fi

      # 사용자가 실제로 내려받는 것은 DMG 다. Tauri 가 번들한 create-dmg 에도
      # 공증·staple 경로가 있어 이미 처리돼 나올 수 있으므로, 먼저 ticket 을
      # 확인하고 없을 때만 직접 공증한다. 공증은 수 분이 걸려서 무조건 한 번 더
      # 돌리는 것은 낭비다. 검증 자체는 어느 경로로 왔든 똑같이 강제한다.
      - name: Notarize and staple the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SRC_DMG="${{ steps.artifacts.outputs.dmg }}"
          VERSION="${{ steps.version.outputs.version }}"
          DMG="$RUNNER_TEMP/Byori-Studio-${VERSION}-universal.dmg"
          cp "$SRC_DMG" "$DMG"

          if xcrun stapler validate "$DMG" >/dev/null 2>&1; then
            echo "the DMG already carries a stapled ticket; skipping a second notarization"
          else
            echo "no stapled ticket on the DMG; submitting it for notarization"

            # 종료 코드만 보면 안 된다. 보고된 status 가 Accepted 가 아닌 어떤
            # 상태로도 릴리스가 진행되면 안 되므로 로그를 직접 검사한다.
            set +e
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_PASSWORD" \
              --wait > "$RUNNER_TEMP/notarize-dmg.log" 2>&1
            notarize_status=$?
            set -e
            cat "$RUNNER_TEMP/notarize-dmg.log"
            if [ "$notarize_status" -ne 0 ] \
              || ! grep -q "status: Accepted" "$RUNNER_TEMP/notarize-dmg.log"; then
              echo "::error::DMG notarization did not return Accepted"
              echo "::error::run 'xcrun notarytool log <submission-id>' with the id printed above"
              exit 1
            fi

            xcrun stapler staple "$DMG"
          fi

          # 여기서부터는 공증을 누가 했는지와 무관하게 무조건 통과해야 한다.
          xcrun stapler validate "$DMG"

          spctl -a -vvv -t open --context context:primary-signature "$DMG" 2>&1 \
            | tee "$RUNNER_TEMP/spctl-dmg"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl-dmg" \
            || { echo "::error::Gatekeeper does not see the DMG as notarized"; exit 1; }

          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Report artifact
        run: |
          set -euo pipefail
          ls -lh "$DMG_PATH"
          # 파일 이름만 적는다. 절대 경로가 들어가면 내려받은 쪽에서
          # `shasum -a 256 -c` 가 러너의 경로를 찾다 실패한다.
          (cd "$(dirname "$DMG_PATH")" && shasum -a 256 "$(basename "$DMG_PATH")") \
            | tee "$DMG_PATH.sha256"

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/$KEYCHAIN_NAME" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/identities" \
            "$RUNNER_TEMP/notarize-dmg.log" "$RUNNER_TEMP/spctl-dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: byori-studio-macos-universal
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
          if-no-files-found: error

      # README 가 "프로덕션 사용 비권장"을 명시하고 있으므로 0.x 는 prerelease 로
      # 표시한다. 1.0 이 나오면 이 조건을 지운다.
      - name: Create Release
        if: steps.version.outputs.mode != 'dryrun'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          generate_release_notes: true
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.DMG_PATH }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
