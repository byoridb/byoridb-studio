name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # brew: only install what is asked for.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # A fixed Rust, the same one release-macos.yml uses. With "latest stable" a new
      # compiler's lints failed the v0.2.0 release on code that had passed the day before.
      # Raise both together, in a pull request, so CI shows what the new compiler reports.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Keep the compiled dependencies when a test fails, so the next push to the
          # same pull request does not rebuild them from nothing.
          cache-on-failure: true
      # The renderer and the integration tests run the real ffmpeg/ffprobe.
      - name: Install FFmpeg
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - run: npm ci
      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Frontend tests, Rust tests, the real-service integration tests and the production build.
      # The tests start their own services on free ports with their own data folders; the
      # variable keeps anything else away from the runner's home as well.
      - name: Verify
        run: npm run verify
        env:
          BYORI_STUDIO_HOME: ${{ runner.temp }}/byori-studio-home
      # After verify: the desktop binary embeds the built frontend (dist/).
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
