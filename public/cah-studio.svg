<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89b4fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#74c7ec;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="#1e1e2e"/>
  <g transform="translate(64, 64)">
    <!-- Node 1 -->
    <circle cx="-24" cy="-20" r="12" fill="url(#grad)"/>
    <!-- Node 2 -->
    <circle cx="24" cy="-20" r="12" fill="url(#grad)"/>
    <!-- Node 3 -->
    <circle cx="0" cy="24" r="12" fill="url(#grad)"/>
    <!-- Edges -->
    <line x1="-12" y1="-20" x2="12" y2="-20" stroke="#89b4fa" stroke-width="3"/>
    <line x1="-18" y1="-10" x2="-6" y2="16" stroke="#89b4fa" stroke-width="3"/>
    <line x1="18" y1="-10" x2="6" y2="16" stroke="#89b4fa" stroke-width="3"/>
  </g>
